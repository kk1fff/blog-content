<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img"><title>Start with a conversation</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#78899a" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="718" height="498" rx="18" fill="#fcfbf8" stroke="#e1e6eb"/><text x="28" y="38" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203348" font-weight="700">Start with a conversation</text><path d="M343 150 H365" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M520 223 V245" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M367 320 H345" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="80" width="300" height="140" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="54" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">01 · YOU</text><text x="54" y="129" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Describe your trip</text><text x="54" y="160" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Dates, interests, pace</text><rect x="370" y="80" width="300" height="140" rx="12" fill="#e9f5f1" stroke="#14776f" stroke-opacity=".25"/><text x="384" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#14776f" font-weight="700">02 · AGENT</text><text x="384" y="129" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Propose an itinerary</text><text x="384" y="160" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Arrange activities</text><text x="384" y="178" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">by day</text><rect x="370" y="250" width="300" height="140" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="384" y="273" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">03 · YOU</text><text x="384" y="299" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Discuss and revise</text><text x="384" y="330" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Choose what fits</text><text x="384" y="348" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">your group</text><rect x="40" y="250" width="300" height="140" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="54" y="273" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">04 · YOU</text><text x="54" y="299" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Organize in Notion</text><text x="54" y="330" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">The source for</text><text x="54" y="348" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">the next stage</text><path d="M190 393 V455 H18 V150 H35" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><text x="70" y="480" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#607183" font-weight="400">Discuss and refine the proposal</text></svg>