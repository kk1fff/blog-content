<svg xmlns="http://www.w3.org/2000/svg" width="360" height="734" viewBox="0 0 360 734" role="img"><title>Start with a conversation</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#78899a" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="358" height="732" rx="18" fill="#fcfbf8" stroke="#e1e6eb"/><text x="24" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203348" font-weight="700">Start with</text><text x="24" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203348" font-weight="700">a conversation</text><path d="M188 189 V211" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 335 V357" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 481 V503" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="70" width="292" height="116" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="56" y="93" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">01 · YOU</text><text x="56" y="119" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Describe your trip</text><text x="56" y="150" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Dates, interests, pace</text><rect x="42" y="216" width="292" height="116" rx="12" fill="#e9f5f1" stroke="#14776f" stroke-opacity=".25"/><text x="56" y="239" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#14776f" font-weight="700">02 · AGENT</text><text x="56" y="265" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Propose an itinerary</text><text x="56" y="296" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Arrange activities</text><text x="56" y="314" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6