xt><rect x="480" y="80" width="200" height="140" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="494" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">03 · YOU</text><text x="494" y="129" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Review possible</text><text x="494" y="151" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">conflicts</text><text x="494" y="176" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Agent raises choices</text><text x="494" y="194" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">with you</text><rect x="480" y="250" width="200" height="140" rx="12" fill="#edf1fc" stroke="#4966ad" stroke-opacity=".25"/><text x="494" y="273" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#4966ad" font-weight="700">04 · CODE</text><text x="494" y="299" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Validate and render</text><text x="494" y="330" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Structured data becomes</text><text x="494" y="348" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">a page</text><rect x="260" y="250" width="200" height="140" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="274" y="273" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">05 · YOU</text><text x="274" y="299" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203348" font-weight="700">Inspect and review</text><text x="274" y="330" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Agent checks</text><text x="274" y="348" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">both previews</text><rect x=