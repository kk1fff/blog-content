<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1026" viewBox="0 0 360 1026" role="img"><title>Make the plan ready to use</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#78899a" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="358" height="1024" rx="18" fill="#fcfbf8" stroke="#e1e6eb"/><text x="24" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203348" font-weight="700">Make the plan</text><text x="24" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203348" font-weight="700">ready to use</text><path d="M188 189 V211" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 335 V357" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 481 V503" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 627 V649" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><path d="M188 773 V795" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="70" width="292" height="116" rx="12" fill="#e9f5f1" stroke="#14776f" stroke-opacity=".25"/><text x="56" y="93" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#14776f" font-weight="700">01 · AGENT</text><text x="56" y="119" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Read the Notion plan</text><text x="56" y="150" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Walk through each day</text><rect x="42" y="216" width="292" height="116" rx="12" fill="#e9f5f1" stroke="#14776f" stroke-opacity=".25"/><text x="56" y="239" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#14776f" font-weight="700">02 · AGENT</text><text x="56" y="265" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Resolve the details</text><text x="56" y="296" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Locations and transport</text><rect x="42" y="362" width="292" height="116" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="56" y="385" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">03 · YOU</text><text x="56" y="411" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Review possible</text><text x="56" y="433" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">conflicts</text><text x="56" y="458" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Agent raises choices</text><text x="56" y="476" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">with you</text><rect x="42" y="508" width="292" height="116" rx="12" fill="#edf1fc" stroke="#4966ad" stroke-opacity=".25"/><text x="56" y="531" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#4966ad" font-weight="700">04 · CODE</text><text x="56" y="557" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Validate and render</text><text x="56" y="588" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Structured data becomes</text><text x="56" y="606" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">a page</text><rect x="42" y="654" width="292" height="116" rx="12" fill="#fbf2e7" stroke="#8c5f2a" stroke-opacity=".25"/><text x="56" y="677" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#8c5f2a" font-weight="700">05 · YOU</text><text x="56" y="703" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Inspect and review</text><text x="56" y="734" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Agent checks</text><text x="56" y="752" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">both previews</text><rect x="42" y="800" width="292" height="116" rx="12" fill="#edf1fc" stroke="#4966ad" stroke-opacity=".25"/><text x="56" y="823" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#4966ad" font-weight="700">06 · CODE</text><text x="56" y="849" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#203348" font-weight="700">Publish after review</text><text x="56" y="880" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#607183" font-weight="400">Deliver the static page</text><path d="M188 919 V981 H18 V128 H37" fill="none" stroke="#78899a" stroke-width="2" marker-end="url(#a)"/><text x="43" y="1002" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">Feedback returns to</text><text x="43" y="1019" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#607183" font-weight="400">the agent</text></svg>